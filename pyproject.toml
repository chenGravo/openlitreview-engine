[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "openlitreview"
version = "0.1.0"
description = "Auditable, on-demand academic literature review pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OpenLitReview contributors" }]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
openlitreview = "openlitreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openlitreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
